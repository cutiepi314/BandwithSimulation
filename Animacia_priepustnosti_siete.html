    { title: &#x27;7 · Aplikácia vytvorí správu&#x27;, description: () =&gt; &#x27;Začíname textom, ktorý chce aplikácia poslať. V ďalšom kroku z neho zvolené kódovanie vytvorí bajty.&#x27;, parts: [], unit: &#x27;Text aplikácie&#x27; },

    { title: &#x27;5 · Relácia: kontext komunikácie&#x27;, description: () =&gt; &#x27;Aplikácia si drží kontext rozhovoru. Vrstva relácie je tu názorný krok modelu OSI: nepridáva sa žiadna univerzálna „relačná hlavička“ a počet bajtov sa nemení.&#x27;, parts: [&#x27;payload&#x27;], unit: &#x27;Dáta v kontexte relácie&#x27; },

    { title: &#x27;3 · Sieťová vrstva pridá IP adresy&#x27;, description: () =&gt; layerDefs[4].protocol() + &#x27; obalí transportné dáta hlavičkou s IP adresami. Označí tiež transportný protokol: TCP = 6, UDP = 17. IP adresy slúžia na smerovanie medzi sieťami.&#x27;, parts: [&#x27;ip&#x27;, &#x27;transport&#x27;, &#x27;payload&#x27;], unit: &#x27;IP paket&#x27; },
    { title: &#x27;2 · Spojová vrstva vytvorí rámec&#x27;, description: () =&gt; model.config.link === &#x27;ethernet&#x27; ? &#x27;Ethernet II pridá MAC adresy a EtherType; za dáta patrí FCS. Pri krátkom IP pakete doplní výplň do minimálnej dĺžky rámca. MAC adresy sú pre tento lokálny spoj.&#x27; : &#x27;Model Wi-Fi pridá 24 B hlavičky 802.11, 8 B LLC/SNAP a 4 B FCS. Reálne Wi-Fi rámce môžu mať ďalšie polia podľa režimu a zabezpečenia.&#x27;, parts: [&#x27;link&#x27;, &#x27;ip&#x27;, &#x27;transport&#x27;, &#x27;payload&#x27;, &#x27;padding&#x27;, &#x27;fcs&#x27;], unit: &#x27;Rámec na lokálnom spoji&#x27; },
    { title: &#x27;1 · Fyzická vrstva vyšle signál&#x27;, description: () =&gt; &#x27;Celý rámec sa prenáša ako signál v médiu. Dole porovnaj, ako vyzerajú vybrané bity pri rôznych spôsoboch linkového kódovania alebo modulácie.&#x27;, parts: [&#x27;link&#x27;, &#x27;ip&#x27;, &#x27;transport&#x27;, &#x27;payload&#x27;, &#x27;padding&#x27;, &#x27;fcs&#x27;], unit: &#x27;Bity celého rámca → signál&#x27; },
    { title: &#x27;1 · Prijímateľ obnoví bity zo signálu&#x27;, description: () =&gt; &#x27;Prijímač zo signálu obnoví bity a zostaví rámec. Táto ukážka predpokladá prenos bez chyby; nedáva falošný dojem, že signál prenáša iba text správy.&#x27;, parts: [&#x27;link&#x27;, &#x27;ip&#x27;, &#x27;transport&#x27;, &#x27;payload&#x27;, &#x27;padding&#x27;, &#x27;fcs&#x27;], unit: &#x27;Signál → bity celého rámca&#x27; },

    { title: &#x27;3 · Prijímateľ spracuje IP hlavičku&#x27;, description: () =&gt; &#x27;IP vrstva vyhodnotí adresu a protokol nasledujúcej vrstvy. IP hlavičku odoberie a dáta odovzdá TCP alebo UDP.&#x27;, parts: [&#x27;transport&#x27;, &#x27;payload&#x27;], unit: () =&gt; model.config.transport === &#x27;tcp&#x27; ? &#x27;TCP segment po odobratí IP&#x27; : &#x27;UDP datagram po odobratí IP&#x27; },
    { title: &#x27;4 · Port určí prijímajúcu aplikáciu&#x27;, description: () =&gt; &#x27;Transport spracuje hlavičku a odovzdá dáta aplikácii podľa cieľového portu &#x27; + model.config.destPort + &#x27;. Port označuje komunikačný koncový bod; jeho číslo samo osebe neurčuje obsah ani šifrovanie.&#x27;, parts: [&#x27;payload&#x27;], unit: &#x27;Dáta po odobratí transportu&#x27; },

  function renderMetrics() {

    const notes = [&#x27;Sedem vrstiev zodpovedá vysvetľovaniu OSI. Internetový zásobník často spája aplikačnú, prezentačnú a relačnú funkciu.&#x27;, &#x27;Výpočet zahŕňa základné hlavičky a FCS. Podiel dát sa počíta zo samotného rámca, bez preambuly, medzier a ďalšej réžie média.&#x27;].concat(model.notes || []);

&lt;div id=&quot;switching-lab&quot;&gt;
  &lt;div class=&quot;sw-eyebrow&quot;&gt;Ethernet / L2 / interaktívna lekcia&lt;/div&gt;
  &lt;h2&gt;Ako switch spracúva rámce&lt;/h2&gt;
  &lt;p class=&quot;sw-intro&quot;&gt;SOURCE učí. DESTINATION rozhoduje. Sleduj rámec cez switch, buduj MAC tabuľku a vyskúšaj, čo sa stane pri neznámom cieli, chybe alebo plnom bufferi.&lt;/p&gt;
  &lt;nav class=&quot;sw-topics&quot; aria-label=&quot;Témy o switchi&quot;&gt;
    &lt;button type=&quot;button&quot; data-sw-topic=&quot;learning&quot; aria-controls=&quot;sw-learning&quot; aria-pressed=&quot;true&quot;&gt;01 · Rámce a MAC tabuľka&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-sw-topic=&quot;forwarding&quot; aria-controls=&quot;sw-forwarding&quot; aria-pressed=&quot;false&quot;&gt;02 · FCS a prepínanie&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-sw-topic=&quot;buffers&quot; aria-controls=&quot;sw-buffers&quot; aria-pressed=&quot;false&quot;&gt;03 · Buffery&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-sw-topic=&quot;basics&quot; aria-controls=&quot;sw-basics&quot; aria-pressed=&quot;false&quot;&gt;04 · MAC a broadcast&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-sw-topic=&quot;exercise&quot; aria-controls=&quot;sw-exercise&quot; aria-pressed=&quot;false&quot;&gt;05 · Ty si switch&lt;/button&gt;
  &lt;/nav&gt;
  &lt;section id=&quot;sw-learning&quot; aria-label=&quot;Učenie MAC tabuľky&quot;&gt;
    &lt;div class=&quot;sw-grid&quot;&gt;
      &lt;div class=&quot;sw-card&quot;&gt;
        &lt;div class=&quot;sw-toolbar&quot;&gt;&lt;h3&gt;Jedna sieť. Štyri počítače.&lt;/h3&gt;&lt;span id=&quot;sw-frame-count&quot; class=&quot;sw-badge&quot;&gt;Rámec 1 / 5&lt;/span&gt;&lt;/div&gt;
        &lt;div id=&quot;sw-network&quot;&gt;&lt;/div&gt;
        &lt;p class=&quot;sw-muted&quot;&gt;Modrá: vstup · zelená: výstup · oranžová: rámec dorazil, ale PC ho neprijme ako svoj.&lt;/p&gt;
        &lt;div class=&quot;sw-frame&quot; aria-label=&quot;Ethernetový rámec&quot;&gt;
          &lt;div&gt;&lt;small&gt;Destination MAC&lt;/small&gt;&lt;strong id=&quot;sw-destination&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;Source MAC&lt;/small&gt;&lt;strong id=&quot;sw-source&quot;&gt;&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;Dáta&lt;/small&gt;&lt;strong&gt;IP paket&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;FCS&lt;/small&gt;&lt;strong&gt;4 B · CRC&lt;/strong&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div id=&quot;sw-stages&quot; class=&quot;sw-stages&quot;&gt;&lt;span&gt;1 · Príjem&lt;/span&gt;&lt;span&gt;2 · Učenie&lt;/span&gt;&lt;span&gt;3 · Cieľ&lt;/span&gt;&lt;span&gt;4 · Odoslanie&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;sw-caption&quot; aria-live=&quot;polite&quot;&gt;&lt;h3 id=&quot;sw-step-title&quot;&gt;&lt;/h3&gt;&lt;p id=&quot;sw-step-text&quot;&gt;&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;sw-actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;sw-prev&quot;&gt;← Späť&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;sw-play&quot; aria-pressed=&quot;false&quot;&gt;▶ Prehrať&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;sw-next&quot; class=&quot;sw-primary&quot;&gt;Ďalší krok →&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;sw-reset&quot;&gt;Od začiatku&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;sw-stack&quot;&gt;
        &lt;div class=&quot;sw-card&quot;&gt;&lt;div class=&quot;sw-toolbar&quot;&gt;&lt;h3&gt;MAC tabuľka SW1&lt;/h3&gt;&lt;span id=&quot;sw-clock&quot; class=&quot;sw-muted&quot;&gt;t = 0 s&lt;/span&gt;&lt;/div&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;VLAN&lt;/th&gt;&lt;th&gt;MAC adresa&lt;/th&gt;&lt;th&gt;Port&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;sw-mac-table&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p id=&quot;sw-table-note&quot; class=&quot;sw-muted&quot;&gt;&lt;/p&gt;&lt;div class=&quot;sw-actions&quot; style=&quot;margin-top:12px&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;sw-age&quot;&gt;Posunúť čas o 300 s&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;sw-clear&quot;&gt;Vymazať tabuľku&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;sw-note&quot;&gt;Dynamické záznamy sa učia zo source MAC. V tomto modeli vypršia po 300 s bez obnovenia. Čas posúvaš ručne.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;sw-card&quot;&gt;&lt;h3&gt;Vyskúšaj vlastný rámec&lt;/h3&gt;&lt;div class=&quot;sw-fields&quot;&gt;&lt;label&gt;Odosielateľ&lt;select id=&quot;sw-custom-source&quot;&gt;&lt;option value=&quot;1&quot;&gt;PC1 · Fa0/1&lt;/option&gt;&lt;option value=&quot;2&quot;&gt;PC2 · Fa0/2&lt;/option&gt;&lt;option value=&quot;3&quot;&gt;PC3 · Fa0/3&lt;/option&gt;&lt;option value=&quot;4&quot;&gt;PC4 · Fa0/4&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Príjemca&lt;select id=&quot;sw-custom-destination&quot;&gt;&lt;option value=&quot;1&quot;&gt;PC1 · M1&lt;/option&gt;&lt;option value=&quot;2&quot;&gt;PC2 · M2&lt;/option&gt;&lt;option value=&quot;3&quot; selected&gt;PC3 · M3&lt;/option&gt;&lt;option value=&quot;4&quot;&gt;PC4 · M4&lt;/option&gt;&lt;option value=&quot;broadcast&quot;&gt;Broadcast · všetci&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; id=&quot;sw-custom&quot; class=&quot;sw-primary&quot;&gt;Odoslať vlastný rámec&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;sw-lesson&quot; style=&quot;margin-top:8px&quot;&gt;Načítať príklad z prezentácie&lt;/button&gt;&lt;label class=&quot;sw-check&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;sw-vlans&quot;&gt; Rozdeliť: PC1/PC2 → VLAN 1, PC3/PC4 → VLAN 2&lt;/label&gt;&lt;p class=&quot;sw-muted&quot;&gt;Zmena VLAN začne s prázdnou tabuľkou. Flooding ostáva v rovnakej VLAN. Cieľ na vstupnom porte sa neprepošle.&lt;/p&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;
  &lt;section id=&quot;sw-forwarding&quot; aria-label=&quot;Metódy prepínania&quot; hidden&gt;
    &lt;div class=&quot;sw-grid&quot;&gt;&lt;div class=&quot;sw-card&quot;&gt;&lt;div class=&quot;sw-toolbar&quot;&gt;&lt;h3&gt;Kedy sa začne odosielanie?&lt;/h3&gt;&lt;span class=&quot;sw-badge&quot;&gt;Schematický čas&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;sw-fields&quot;&gt;&lt;label&gt;Metóda&lt;select id=&quot;sw-method&quot;&gt;&lt;option value=&quot;store&quot;&gt;Store-and-forward&lt;/option&gt;&lt;option value=&quot;cut&quot;&gt;Cut-through&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Rámec&lt;select id=&quot;sw-corrupt&quot;&gt;&lt;option value=&quot;valid&quot;&gt;Platný FCS&lt;/option&gt;&lt;option value=&quot;bad&quot;&gt;Poškodený rámec · FCS nesedí&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;sw-timeline&quot;&gt;&lt;span class=&quot;sw-muted&quot;&gt;Príjem: Destination → Source → dáta → FCS&lt;/span&gt;&lt;div class=&quot;sw-track&quot;&gt;&lt;span id=&quot;sw-rx-bar&quot;&gt;&lt;/span&gt;&lt;small id=&quot;sw-rx-label&quot;&gt;&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;sw-muted&quot;&gt;Výstup do cieľového portu&lt;/span&gt;&lt;div class=&quot;sw-track sw-send&quot;&gt;&lt;span id=&quot;sw-tx-bar&quot;&gt;&lt;/span&gt;&lt;small id=&quot;sw-tx-label&quot;&gt;&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;label&gt;Čas &lt;input class=&quot;sw-slider&quot; id=&quot;sw-forward-time&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;210&quot; value=&quot;0&quot;&gt;&lt;/label&gt;&lt;div class=&quot;sw-actions&quot; style=&quot;margin-top:14px&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;sw-forward-play&quot; aria-pressed=&quot;false&quot;&gt;▶ Prehrať&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;sw-forward-reset&quot;&gt;Vynulovať čas&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;sw-forward-status&quot; class=&quot;sw-callout&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;p class=&quot;sw-muted&quot;&gt;Rovnaké rýchlosti vstupu a výstupu, voľný cieľový port, známa destination MAC. Bez preambuly a medzirámcovej medzery; oneskorenia sú ilustračné.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sw-card&quot;&gt;&lt;h3&gt;FCS odhalí chybu, neopraví ju&lt;/h3&gt;&lt;p class=&quot;sw-note&quot;&gt;FCS má 4 bajty na konci rámca. Príjemca porovná prijatú hodnotu s CRC vypočítaným z prijatého rámca. Pri nezhode je rámec chybný.&lt;/p&gt;&lt;div class=&quot;sw-callout&quot;&gt;Store-and-forward čaká na celý rámec a kontrolu FCS. Cut-through môže začať už po prečítaní cieľovej MAC.&lt;/div&gt;&lt;p class=&quot;sw-muted&quot;&gt;Cut-through skracuje čakanie, ale môže poslať aj poškodený rámec. Cieľová sieťová karta ho po kontrole FCS zahodí.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;
  &lt;section id=&quot;sw-buffers&quot; aria-label=&quot;Pamäť switcha&quot; hidden&gt;
    &lt;div class=&quot;sw-grid&quot;&gt;&lt;div class=&quot;sw-card&quot;&gt;&lt;div class=&quot;sw-toolbar&quot;&gt;&lt;h3&gt;100 Mb/s dovnútra → 10 Mb/s von&lt;/h3&gt;&lt;span class=&quot;sw-badge&quot;&gt;Cieľ: Fa0/4&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;sw-fields&quot;&gt;&lt;label&gt;Pamäť&lt;select id=&quot;sw-buffer-mode&quot;&gt;&lt;option value=&quot;port&quot;&gt;Port-based · 4 miesta na port&lt;/option&gt;&lt;option value=&quot;shared&quot;&gt;Shared memory · 16 spoločných miest&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Prísun rámcov&lt;select id=&quot;sw-buffer-load&quot;&gt;&lt;option value=&quot;10&quot;&gt;100 Mb/s · preťaženie&lt;/option&gt;&lt;option value=&quot;1&quot;&gt;10 Mb/s · vyrovnaný prenos&lt;/option&gt;&lt;option value=&quot;0&quot;&gt;0 Mb/s · vyprázdniť front&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div id=&quot;sw-buffer-view&quot;&gt;&lt;/div&gt;&lt;div class=&quot;sw-stats&quot;&gt;&lt;div&gt;&lt;strong id=&quot;sw-buffer-waiting&quot;&gt;0&lt;/strong&gt;&lt;span&gt;čaká&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong id=&quot;sw-buffer-sent&quot;&gt;0&lt;/strong&gt;&lt;span&gt;odoslaných&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;strong id=&quot;sw-buffer-dropped&quot;&gt;0&lt;/strong&gt;&lt;span&gt;zahodených&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sw-actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;sw-buffer-tick&quot; class=&quot;sw-primary&quot;&gt;Jeden časový krok&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;sw-buffer-play&quot; aria-pressed=&quot;false&quot;&gt;▶ Spustiť&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;sw-buffer-reset&quot;&gt;Vyprázdniť a vynulovať&lt;/button&gt;&lt;/div&gt;&lt;p id=&quot;sw-buffer-status&quot; class=&quot;sw-callout&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;p class=&quot;sw-muted&quot;&gt;Model rovnako veľkých rámcov: za krok odíde najviac 1 čakajúci rámec na port a potom príde dávka. Jeden krok zodpovedá času odoslania rámca pri 10 Mb/s. Zmena typu pamäte vynuluje simuláciu.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sw-card&quot;&gt;&lt;h3&gt;Rovnaká kapacita, iné využitie&lt;/h3&gt;&lt;p class=&quot;sw-note&quot;&gt;Port-based: každý výstup má v tejto ukážke 4 vyhradené miesta. Fa0/4 sa zaplní, hoci pri ostatných portoch zostáva voľná pamäť.&lt;/p&gt;&lt;p class=&quot;sw-note&quot;&gt;Shared memory: všetkých 16 miest môže využiť práve preťažený port. Pridelenie sa mení podľa potreby.&lt;/p&gt;&lt;div class=&quot;sw-callout&quot;&gt;Buffer vyrovná krátku špičku. Pri trvalom preťažení sa zaplní aj spoločná pamäť a ďalšie rámce sa zahodia.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;
  &lt;section id=&quot;sw-basics&quot; aria-label=&quot;MAC adresy a broadcast&quot; hidden&gt;
    &lt;div class=&quot;sw-grid&quot;&gt;&lt;div class=&quot;sw-stack&quot;&gt;&lt;div class=&quot;sw-card&quot;&gt;&lt;h3&gt;MAC adresa = 48 bitov = 6 bajtov&lt;/h3&gt;&lt;div class=&quot;sw-octets&quot;&gt;&lt;span&gt;02&lt;small&gt;8 bitov&lt;/small&gt;&lt;/span&gt;&lt;span&gt;00&lt;small&gt;8 bitov&lt;/small&gt;&lt;/span&gt;&lt;span&gt;00&lt;small&gt;8 bitov&lt;/small&gt;&lt;/span&gt;&lt;span&gt;00&lt;small&gt;8 bitov&lt;/small&gt;&lt;/span&gt;&lt;span&gt;00&lt;small&gt;8 bitov&lt;/small&gt;&lt;/span&gt;&lt;span&gt;01&lt;small&gt;8 bitov&lt;/small&gt;&lt;/span&gt;&lt;/div&gt;&lt;p&gt;12 hexadecimálnych číslic · každá predstavuje 4 bity · číslice 0–9 a A–F.&lt;/p&gt;&lt;p class=&quot;sw-note&quot;&gt;MAC označuje sieťové rozhranie. Pri univerzálne pridelenej adrese tvorí prvých 24 bitov OUI výrobcu a ďalších 24 bitov časť pridelenú výrobcom. Naše adresy 02:00:00:00:00:01 až :04 sú lokálne pridelené príklady; prefix 02 tu neurčuje výrobcu.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;sw-card&quot;&gt;&lt;h3&gt;Tri situácie doručovania&lt;/h3&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Cieľ&lt;/th&gt;&lt;th&gt;Čo switch urobí&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Known unicast&lt;/td&gt;&lt;td&gt;Jeden port z MAC tabuľky&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Unknown unicast&lt;/td&gt;&lt;td&gt;Flooding v rovnakej VLAN&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Broadcast&lt;/td&gt;&lt;td&gt;Flooding v rovnakej VLAN&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p class=&quot;sw-muted&quot;&gt;Flooding nemení destination MAC a vynecháva vstupný port. Ak je známy cieľ na vstupnom porte, switch rámec ďalej neprepošle.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sw-stack&quot;&gt;&lt;div class=&quot;sw-card&quot;&gt;&lt;h3&gt;FF:FF:FF:FF:FF:FF&lt;/h3&gt;&lt;p class=&quot;sw-note&quot;&gt;Broadcast MAC obsahuje 48 jednotiek. Napríklad ARP request sa odošle všetkým ostatným zariadeniam v danej broadcastovej doméne, aj keď je MAC tabuľka plná.&lt;/p&gt;&lt;div class=&quot;sw-callout&quot;&gt;Jedna VLAN = jedna L2 broadcastová doména. Samotné porty switcha ju nerozdelia.&lt;/div&gt;&lt;button type=&quot;button&quot; id=&quot;sw-demo-vlan&quot;&gt;Vyskúšať broadcast vo VLAN&lt;/button&gt;&lt;details&gt;&lt;summary&gt;Čo spôsobuje priveľa broadcastov?&lt;/summary&gt;&lt;p&gt;Obsadzujú linky a zaťažujú zariadenia. L2 slučka môže spôsobiť broadcastovú búrku. STP bráni slučkám, VLAN zmenšujú domény a storm control obmedzuje príslušnú prevádzku.&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;div class=&quot;sw-card&quot;&gt;&lt;h3&gt;Rýchle opakovanie&lt;/h3&gt;&lt;details&gt;&lt;summary&gt;Čo prenáša Ethernet?&lt;/summary&gt;&lt;p&gt;Rámce v spojovej vrstve OSI, L2. Source MAC označuje odosielateľa, destination MAC príjemcu na lokálnej linke.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;MAC alebo IP?&lt;/summary&gt;&lt;p&gt;L2 switch vyberá výstup podľa destination MAC. Router smeruje IP paket podľa cieľovej IP adresy.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Full-duplex a CSMA/CD?&lt;/summary&gt;&lt;p&gt;Obe strany môžu súčasne vysielať aj prijímať. Pri full-duplex sa CSMA/CD nepoužíva.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Ako zobrazím tabuľku?&lt;/summary&gt;&lt;p&gt;Na switchi: &lt;code&gt;show mac address-table&lt;/code&gt;. Na PC: &lt;code&gt;arp -a&lt;/code&gt; zobrazuje ARP cache, nie MAC tabuľku switcha.&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;
  &lt;section id=&quot;sw-exercise&quot; aria-label=&quot;Praktická úloha Ty si switch&quot; hidden&gt;
    &lt;div class=&quot;sw-grid&quot;&gt;&lt;div class=&quot;sw-card&quot;&gt;&lt;div class=&quot;sw-toolbar&quot;&gt;&lt;h3&gt;Ty si switch&lt;/h3&gt;&lt;span id=&quot;sw-exercise-count&quot; class=&quot;sw-badge&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;sw-muted&quot;&gt;A → Fa0/1 · B → Fa0/2 · C → Fa0/3 · D → Fa0/4. Jedna VLAN, na začiatku prázdna tabuľka, bez starnutia. A = 02:00:00:00:00:0A, ostatní končia :0B, :0C, :0D.&lt;/p&gt;&lt;h3 id=&quot;sw-question&quot; style=&quot;margin-top:20px&quot;&gt;&lt;/h3&gt;&lt;p class=&quot;sw-muted&quot; style=&quot;margin-top:8px&quot;&gt;Ktorými portmi switch rámec odošle? Tabuľka sa medzi rámcami zachováva.&lt;/p&gt;&lt;div id=&quot;sw-answers&quot; class=&quot;sw-answers&quot;&gt;&lt;/div&gt;&lt;div id=&quot;sw-exercise-feedback&quot; class=&quot;sw-feedback&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;div class=&quot;sw-actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;sw-exercise-next&quot; disabled class=&quot;sw-primary&quot;&gt;Ďalší rámec →&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;sw-exercise-reset&quot;&gt;Začať znova&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;sw-card&quot;&gt;&lt;h3&gt;Tabuľka po vyriešených krokoch&lt;/h3&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;VLAN&lt;/th&gt;&lt;th&gt;MAC&lt;/th&gt;&lt;th&gt;Port&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;sw-exercise-table&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;p id=&quot;sw-exercise-score&quot; class=&quot;sw-muted&quot;&gt;&lt;/p&gt;&lt;div class=&quot;sw-note&quot;&gt;Pri každom rámci si najprv všimni SOURCE: tú sa switch naučí alebo obnoví. Až potom hľadaj DESTINATION.&lt;/div&gt;&lt;details&gt;&lt;summary&gt;Celé zadanie z prezentácie&lt;/summary&gt;&lt;p&gt;1. A → C&lt;br&gt;2. C → A&lt;br&gt;3. B → C&lt;br&gt;4. A → D&lt;br&gt;5. D → broadcast&lt;br&gt;6. C → D&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/section&gt;
  &lt;p class=&quot;sw-footer&quot;&gt;Podľa &lt;a href=&quot;https://www.canva.com/design/DAHXIU0CIbg/bNhIl6QAwFyafuUssmY5aQ/edit&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;prezentácie „Ako switch spracováva ethernetové rámce – pokračovanie“&lt;/a&gt; · &lt;a href=&quot;https://www.ciscopress.com/articles/article.asp?p=3089352&amp;amp;seqNum=7&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Cisco Press: prepínanie a buffery&lt;/a&gt;. Topológia bez slučiek, aktívne porty; VLAN sú v ukážke priradené access portom.&lt;/p&gt;
&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  &#x27;use strict&#x27;;
  const M = window.SwitchingModel;
  const $ = id =&gt; document.getElementById(&#x27;sw-&#x27; + id);
  const root = $(&#x27;learning&#x27;).parentElement;
  const names = { unknown: &#x27;Unknown unicast · flooding&#x27;, known: &#x27;Known unicast&#x27;, broadcast: &#x27;Broadcast · flooding&#x27;, filtered: &#x27;Filtrovanie · rovnaký port&#x27; };
  let topic = &#x27;learning&#x27;, timer = null, forwardTimer = null, bufferTimer = null;
  let sequence = M.lesson, frameIndex = 0, phase = 0, baseTable = [], history = [], clock = 0, custom = false;
  const getVlans = () =&gt; $(&#x27;vlans&#x27;).checked ? [1,1,2,2] : [1,1,1,1];
  const currentFrame = () =&gt; ({ source: sequence[frameIndex][0], destination: sequence[frameIndex][1] });
  const result = () =&gt; M.process(baseTable, currentFrame(), getVlans(), clock);
  const visibleTable = () =&gt; phase &gt;= 1 ? result().table : baseTable;
  const portText = ports =&gt; ports.length ? ports.map(p =&gt; &#x27;Fa0/&#x27; + p).join(&#x27;, &#x27;) : &#x27;žiadny port&#x27;;
  function pause() {
    clearInterval(timer); clearInterval(forwardTimer); clearInterval(bufferTimer);
    timer = forwardTimer = bufferTimer = null;
    for (const [id,label] of [[&#x27;play&#x27;,&#x27;▶ Prehrať&#x27;],[&#x27;forward-play&#x27;,&#x27;▶ Prehrať&#x27;],[&#x27;buffer-play&#x27;,&#x27;▶ Spustiť&#x27;]]) {
      $(id).textContent = label; $(id).setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;);
    }
    drawNetwork(result());
  }
  function showTopic(next) {
    pause(); topic = next;
    root.querySelectorAll(&#x27;[data-sw-topic]&#x27;).forEach(button =&gt; {
      const selected = button.dataset.swTopic === topic;
      button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
      $(button.dataset.swTopic).hidden = !selected;
    });
  }
  root.querySelectorAll(&#x27;[data-sw-topic]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; showTopic(button.dataset.swTopic)));
  function tableHTML(table, highlight) {
    return table.length ? table.map(row =&gt; `&lt;tr${row.mac === highlight ? &#x27; class=&quot;sw-learned&quot;&#x27; : &#x27;&#x27;}&gt;&lt;td&gt;${row.vlan}&lt;/td&gt;&lt;td&gt;&lt;code&gt;${row.mac}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Fa0/${row.port}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;) : &#x27;&lt;tr&gt;&lt;td colspan=&quot;3&quot;&gt;Zatiaľ žiadny záznam&lt;/td&gt;&lt;/tr&gt;&#x27;;
  }
  function drawNetwork(r) {
    const positions = [[100,75],[540,75],[100,295],[540,295]], vlans = getVlans();
    const reduce = matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
    let content = &#x27;&lt;title id=&quot;sw-net-title&quot;&gt;Štyri PC pripojené k switchu SW1&lt;/title&gt;&lt;desc id=&quot;sw-net-description&quot;&gt;&#x27; + (phase === 3 ? names[r.kind] + &#x27;. Výstup: &#x27; + portText(r.ports) : &#x27;Vstup Fa0/&#x27; + r.ingress + &#x27;. &#x27; + [&#x27;Príjem rámca&#x27;,&#x27;Učenie source MAC&#x27;,&#x27;Vyhľadanie destination MAC&#x27;][phase]) + &#x27;&lt;/desc&gt;&#x27;;
    positions.forEach(([x,y],i) =&gt; {
      const p = i+1, input = p === r.ingress, output = phase === 3 &amp;&amp; r.ports.includes(p);
      const accepted = r.destination === M.BROADCAST || r.destination === M.mac(p);
      const endX = x &lt; 300 ? 255 : 385, endY = y &lt; 180 ? 155 : 215;
      content += `&lt;path class=&quot;sw-wire ${input ? &#x27;sw-input&#x27; : output ? &#x27;sw-output&#x27; : &#x27;&#x27;}&quot; d=&quot;M${x},${y} L${endX},${endY}&quot;/&gt;`;
      content += `&lt;rect class=&quot;sw-node&quot; x=&quot;${x-62}&quot; y=&quot;${y-32}&quot; width=&quot;124&quot; height=&quot;64&quot; rx=&quot;10&quot;${output ? &#x27; style=&quot;stroke:var(&#x27; + (accepted ? &#x27;--sw-green&#x27; : &#x27;--sw-orange&#x27;) + &#x27;)&quot;&#x27; : &#x27;&#x27;}/&gt;&lt;text x=&quot;${x}&quot; y=&quot;${y-6}&quot; text-anchor=&quot;middle&quot; font-size=&quot;17&quot; font-weight=&quot;700&quot;&gt;PC${p}&lt;/text&gt;&lt;text x=&quot;${x}&quot; y=&quot;${y+15}&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;M${p} · …:0${p} · VLAN ${vlans[i]}&lt;/text&gt;`;
      content += `&lt;text x=&quot;${x &lt; 300 ? 200 : 440}&quot; y=&quot;${y &lt; 180 ? 119 : 255}&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;Fa0/${p}&lt;/text&gt;`;
      if ((phase === 0 &amp;&amp; input) || output) {
        const start = input ? [x,y] : [endX,endY], end = input ? [endX,endY] : [x,y];
        content += timer !== null &amp;&amp; !reduce ? `&lt;circle r=&quot;6&quot; class=&quot;${input ? &#x27;sw-dot&#x27; : &#x27;sw-dot-out&#x27;}&quot;&gt;&lt;animateMotion dur=&quot;1.4s&quot; repeatCount=&quot;indefinite&quot; path=&quot;M${start[0]},${start[1]} L${end[0]},${end[1]}&quot;/&gt;&lt;/circle&gt;` : `&lt;circle r=&quot;6&quot; class=&quot;${input ? &#x27;sw-dot&#x27; : &#x27;sw-dot-out&#x27;}&quot; cx=&quot;${(start[0]+end[0])/2}&quot; cy=&quot;${(start[1]+end[1])/2}&quot;/&gt;`;
      }
      if (output) content += `&lt;text x=&quot;${x}&quot; y=&quot;${y+49}&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; style=&quot;fill:var(${accepted ? &#x27;--sw-green&#x27; : &#x27;--sw-orange&#x27;})&quot;&gt;${accepted ? &#x27;Prijme rámec&#x27; : &#x27;Iná cieľová MAC → ignoruje&#x27;}&lt;/text&gt;`;
    });
    content += &#x27;&lt;rect class=&quot;sw-node&quot; x=&quot;255&quot; y=&quot;140&quot; width=&quot;130&quot; height=&quot;90&quot; rx=&quot;13&quot; style=&quot;fill:var(--accent);stroke:var(--primary)&quot;/&gt;&lt;text x=&quot;320&quot; y=&quot;177&quot; text-anchor=&quot;middle&quot; font-size=&quot;23&quot; font-weight=&quot;700&quot;&gt;SW1&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;202&quot; text-anchor=&quot;middle&quot; font-size=&quot;11&quot;&gt;L2 switch&lt;/text&gt;&#x27;;
    $(&#x27;network&#x27;).innerHTML = `&lt;svg class=&quot;sw-diagram&quot; viewBox=&quot;0 0 640 365&quot; role=&quot;img&quot; aria-labelledby=&quot;sw-net-title sw-net-description&quot;&gt;${content}&lt;/svg&gt;`;
  }
  function renderLearning() {
    const r = result(), frame = currentFrame();
    drawNetwork(r);
    $(&#x27;source&#x27;).textContent = r.source; $(&#x27;destination&#x27;).textContent = r.destination;
    $(&#x27;frame-count&#x27;).textContent = custom ? &#x27;Vlastný rámec&#x27; : `Rámec ${frameIndex+1} / ${sequence.length}`;
    $(&#x27;clock&#x27;).textContent = `t = ${clock} s`;
    $(&#x27;mac-table&#x27;).innerHTML = tableHTML(visibleTable(), phase &gt;= 1 ? r.source : null);
    const decision = r.kind === &#x27;known&#x27; ? `Destination MAC pozná: ${r.destination} → ${portText(r.ports)}.` : r.kind === &#x27;unknown&#x27; ? `Destination ${r.destination} v tejto VLAN nepozná. Použije ostatné porty VLAN ${r.vlan}; cieľová MAC zostáva nezmenená.` : r.kind === &#x27;broadcast&#x27; ? `FF:FF:FF:FF:FF:FF je broadcast. Odošle ho ostatným portom VLAN ${r.vlan}, aj pri plnej tabuľke.` : &#x27;Cieľ je dostupný cez ten istý port, cez ktorý rámec prišiel. Switch ho ďalej neprepošle.&#x27;;
    const captions = [
      [`PC${frame.source} → ${frame.destination === &#x27;broadcast&#x27; ? &#x27;všetci v rovnakej VLAN&#x27; : &#x27;PC&#x27;+frame.destination}`, `Rámec prichádza cez Fa0/${frame.source}. Sleduj najprv source MAC a potom destination MAC. Ukážka pracuje s platným rámcom; FCS skúmaj v druhej téme.`],
      [r.learned ? &#x27;Nový záznam zo SOURCE MAC&#x27; : &#x27;Obnovenie záznamu zo SOURCE MAC&#x27;, `${r.source} → Fa0/${frame.source}, VLAN ${r.vlan}. Switch sa učí adresu odosielateľa, nie príjemcu.`],
      [names[r.kind], decision],
      [r.ports.length ? &#x27;Výstup: &#x27; + portText(r.ports) : &#x27;Rámec sa ďalej neprepošle&#x27;, decision + (r.kind === &#x27;unknown&#x27; ? &#x27; Ostatné PC s inou cieľovou MAC rámec ignorujú.&#x27; : &#x27;&#x27;)]
    ];
    $(&#x27;step-title&#x27;).textContent = captions[phase][0]; $(&#x27;step-text&#x27;).textContent = captions[phase][1];
    $(&#x27;table-note&#x27;).textContent = phase &gt;= 1 ? `${r.learned ? &#x27;Naučené&#x27; : &#x27;Obnovené&#x27;}: M${frame.source} → Fa0/${frame.source}. Cieľ sa samotným doručením nenaučí.` : &#x27;Tabuľka pred spracovaním tohto rámca.&#x27;;
    [...$(&#x27;stages&#x27;).children].forEach((item,i) =&gt; item.classList.toggle(&#x27;sw-active&#x27;,i &lt;= phase));
    $(&#x27;prev&#x27;).disabled = frameIndex === 0 &amp;&amp; phase === 0;
    $(&#x27;next&#x27;).disabled = frameIndex === sequence.length-1 &amp;&amp; phase === 3;
    $(&#x27;next&#x27;).textContent = phase === 3 &amp;&amp; frameIndex &lt; sequence.length-1 ? &#x27;Ďalší rámec →&#x27; : &#x27;Ďalší krok →&#x27;;
  }
  function advance() {
    if (phase &lt; 3) phase++;
    else if (frameIndex &lt; sequence.length-1) { history[frameIndex] = baseTable.map(row =&gt; ({...row})); baseTable = result().table; frameIndex++; phase = 0; }
    else { pause(); return; }
    renderLearning();
    if (frameIndex === sequence.length-1 &amp;&amp; phase === 3) pause();
  }
  function startSequence(frames, own = false, table = []) {
    pause(); sequence = frames; custom = own; baseTable = table; history = []; frameIndex = phase = 0; renderLearning();
  }
  $(&#x27;next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { pause(); advance(); });
  $(&#x27;prev&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { pause(); if (phase) phase--; else if (frameIndex) { frameIndex--; baseTable = history[frameIndex].map(row =&gt; ({...row})); phase=3; } renderLearning(); });
  $(&#x27;play&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    if (timer !== null) { pause(); return; }
    if (frameIndex === sequence.length-1 &amp;&amp; phase === 3) startSequence(sequence,custom);
    timer = setInterval(advance,1800); $(&#x27;play&#x27;).textContent = &#x27;Ⅱ Pozastaviť&#x27;; $(&#x27;play&#x27;).setAttribute(&#x27;aria-pressed&#x27;,&#x27;true&#x27;); renderLearning();
  });
  $(&#x27;reset&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; startSequence(sequence,custom));
  $(&#x27;lesson&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { $(&#x27;vlans&#x27;).checked=false; startSequence(M.lesson); });
  $(&#x27;custom&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; startSequence([[Number($(&#x27;custom-source&#x27;).value), $(&#x27;custom-destination&#x27;).value === &#x27;broadcast&#x27; ? &#x27;broadcast&#x27; : Number($(&#x27;custom-destination&#x27;).value)]], true, visibleTable()));
  $(&#x27;clear&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; startSequence(sequence,custom));
  $(&#x27;age&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { const table = visibleTable(), frame = sequence[frameIndex]; clock += 300; startSequence([frame],true,M.age(table,clock)); $(&#x27;table-note&#x27;).textContent = &#x27;Uplynulo 300 s bez prevádzky: neobnovené dynamické záznamy vypršali. Ďalší rámec ich môže znovu naučiť.&#x27;; });
  $(&#x27;vlans&#x27;).addEventListener(&#x27;change&#x27;, () =&gt; startSequence(sequence,custom));
  $(&#x27;demo-vlan&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { showTopic(&#x27;learning&#x27;); $(&#x27;vlans&#x27;).checked=true; startSequence([[1,&#x27;broadcast&#x27;]],true); });

  function renderForward() {
    const time = Number($(&#x27;forward-time&#x27;).value), cut = $(&#x27;method&#x27;).value === &#x27;cut&#x27;, bad = $(&#x27;corrupt&#x27;).value === &#x27;bad&#x27;;
    const received = Math.min(time,100), sent = !cut &amp;&amp; bad ? 0 : Math.max(0,Math.min(100,time-(cut ? 8 : 110)));
    $(&#x27;rx-bar&#x27;).style.width = received+&#x27;%&#x27;; $(&#x27;tx-bar&#x27;).style.width = sent+&#x27;%&#x27;;
    $(&#x27;rx-label&#x27;).textContent = `Prijaté ${received} %${received === 100 ? &#x27; · FCS dorazilo&#x27; : &#x27;&#x27;}`;
    $(&#x27;tx-label&#x27;).textContent = !cut &amp;&amp; bad &amp;&amp; time &gt;= 100 ? &#x27;Zahodený · žiadny výstup&#x27; : `Odoslané ${sent} %`;
    let status;
    if (cut) status = time &lt; 8 ? &#x27;Switch čaká na prečítanie destination MAC.&#x27; : time &lt; 100 ? &#x27;Odosielanie sa už začalo, hoci zvyšok rámca vrátane FCS ešte prichádza.&#x27; : bad ? &#x27;Poškodený rámec už smeruje k príjemcovi. Jeho sieťová karta pri kontrole FCS odhalí chybu a rámec zahodí.&#x27; : &#x27;Príjem je dokončený; výstup sa začal ešte počas prijímania.&#x27;;
    else status = time &lt; 100 ? &#x27;Switch najprv prijíma celý rámec. Na výstupe zatiaľ nič neposiela.&#x27; : bad ? &#x27;CRC nesúhlasí s prijatým FCS. Switch rámec zahodí a neodošle ho.&#x27; : time &lt; 110 ? &#x27;Celý rámec je prijatý. Switch overuje FCS pred odoslaním.&#x27; : &#x27;FCS je platné. Až teraz switch odošle rámec.&#x27;;
